services:
  postgres:
    image: postgres:16-alpine
    container_name: tracelite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracelite
      POSTGRES_PASSWORD: tracelite_dev
      POSTGRES_DB: tracelite
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelite"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracelite-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tracelite:tracelite_dev@postgres:5432/tracelite
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: tracelite-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
